<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>トレス🆗の男子高校生｜作画資料写真館</title>
<meta name="description" content="絵描きの姉のために撮った資料用写真。トレスOK。カテゴリ・服装・向きで探せます。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --surface:#fff; --ink:#20232b; --sub:#6b7080; --line:#e4e0d8;
  --accent:#2a3866; --accent-ink:#fff; --pop:#ff7d96;
  --radius:14px; --shadow:0 1px 2px rgba(20,24,40,.06),0 6px 18px rgba(20,24,40,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#14161c;--surface:#1d2029;--ink:#eceef4;--sub:#9aa0b2;--line:#2c3040;--accent:#8fa4ff;--accent-ink:#10131c;--pop:#ff8fa6;--shadow:none}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-text-size-adjust:100%;
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}

/* header */
.top{padding:18px 0 8px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:44px;height:44px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:22px;flex:0 0 auto}
.brand h1{font-size:18px;line-height:1.25;margin:0}
.brand p{margin:0;font-size:12px;color:var(--sub)}
.links{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-size:13px;font-weight:700}
.pill.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.pill.soon{color:var(--sub);font-weight:500;border-style:dashed;background:transparent}
.intro{margin:6px 0 14px;color:var(--sub);font-size:14px}

/* controls */
.controls{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:8px 0 10px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px}
.tabs::-webkit-scrollbar,.frow::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:transparent;font:inherit;font-weight:700;font-size:14px;color:var(--sub);padding:8px 12px;border-radius:999px;cursor:pointer}
.tab[aria-selected=true]{background:var(--accent);color:var(--accent-ink)}
.tab .n{font-weight:500;opacity:.75;margin-left:4px;font-size:12px}
.filters{display:flex;flex-direction:column;gap:6px}
.frow{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none}
.flabel{flex:0 0 auto;font-size:12px;color:var(--sub);width:34px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:13px;padding:5px 11px;border-radius:999px;cursor:pointer}
.chip[aria-pressed=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface));font-weight:700}
.chip:disabled{opacity:.4;cursor:default}
.chip .n{opacity:.6;margin-left:3px;font-size:11px}
.status{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub);margin-top:6px;min-height:18px}
.reset{border:0;background:none;color:var(--accent);font:inherit;font-size:12px;font-weight:700;cursor:pointer;padding:0}

/* gallery */
.group{margin:22px 0 8px}
.ghead{display:flex;align-items:baseline;gap:8px;margin:0 0 10px}
.ghead h2{font-size:16px;margin:0}
.ghead span{font-size:12px;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,1fr);gap:12px}}
@media (min-width:960px){.grid{grid-template-columns:repeat(4,1fr)}}
@media (min-width:1200px){.grid{grid-template-columns:repeat(5,1fr)}}
.card{position:relative;padding:0;border:0;border-radius:var(--radius);overflow:hidden;background:var(--surface);box-shadow:var(--shadow);cursor:zoom-in;aspect-ratio:3/4;display:block;width:100%}
.card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s}
@media (hover:hover){.card:hover img{transform:scale(1.03)}}
.card .step{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.92);color:#20232b;border-radius:999px;font-size:11px;font-weight:700;padding:1px 8px}
.card .ang{position:absolute;right:8px;bottom:8px;background:rgba(20,24,40,.62);color:#fff;border-radius:999px;font-size:11px;padding:1px 9px}
.card:focus-visible,.chip:focus-visible,.tab:focus-visible,.pill:focus-visible,.reset:focus-visible{outline:3px solid var(--pop);outline-offset:2px}
.empty{padding:48px 0;text-align:center;color:var(--sub)}

/* footer */
.foot{margin:40px 0 48px;padding:20px;border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);font-size:13px}
.foot h3{margin:0 0 8px;font-size:14px}
.foot ul{margin:0 0 14px;padding-left:1.2em}
.foot p{margin:0;color:var(--sub)}
.foot a{color:var(--accent);font-weight:700}

/* lightbox */
dialog{border:0;padding:0;background:transparent;max-width:none;max-height:none;width:100%;height:100%;color:#fff}
dialog::backdrop{background:rgba(10,12,18,.95)}
body:has(dialog[open]){overflow:hidden}
.lb{height:100%;display:flex;flex-direction:column;padding:12px}
.lb-stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.lb-stage img{max-width:100%;max-height:calc(100dvh - 110px);object-fit:contain;border-radius:10px;background:#0002}
.lb-nav,.lb-close{position:absolute;border:0;background:rgba(255,255,255,.18);color:#fff;width:44px;height:44px;border-radius:50%;font-size:24px;cursor:pointer;display:grid;place-items:center}
.lb-close{top:0;right:0}
.lb-nav.prev{left:0;top:50%;transform:translateY(-50%)}
.lb-nav.next{right:0;top:50%;transform:translateY(-50%)}
.lb-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:10px;flex-wrap:wrap}
.lb-cap{font-size:14px}
.lb-cap small{display:block;color:#b9bfd0;font-size:12px}
.btn{background:var(--pop);color:#20232b;font-weight:700;text-decoration:none;padding:9px 16px;border-radius:999px;font-size:14px}
.lb button:focus-visible,.btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.card img{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true">🆗</div>
      <div>
        <h1>トレス🆗の男子高校生</h1>
        <p>作画資料写真館</p>
      </div>
    </div>
    <nav class="links" aria-label="外部リンク">
      <a class="pill primary" href="https://www.tiktok.com/@dyu359409lf" target="_blank" rel="noopener">TikTok</a>
      <a class="pill" href="https://mond.how/x_dk" target="_blank" rel="noopener">リクエストする</a>
      <span class="pill soon">シワ練（準備中）</span>
      <span class="pill soon">BOOTH（準備中）</span>
      <a class="pill" href="https://x.com/dyu359409lf" target="_blank" rel="noopener">X</a>
    </nav>
  </header>
  <p class="intro">絵描きの姉のために撮った資料用の写真です。顔は線画で隠してあります。タップで拡大・ダウンロードできます。</p>
</div>

<div class="controls">
  <div class="wrap">
    <div class="tabs" id="tabs" role="tablist" aria-label="カテゴリ"></div>
    <div class="filters">
      <div class="frow"><span class="flabel">服装</span><span id="wearChips" style="display:contents"></span></div>
      <div class="frow"><span class="flabel">向き</span><span id="angleChips" style="display:contents"></span></div>
    </div>
    <div class="status"><span id="count"></span><button class="reset" id="reset" hidden>絞り込みを解除</button></div>
  </div>
</div>

<main class="wrap" id="gallery" aria-live="polite"></main>

<footer class="wrap">
  <div class="foot">
    <h3>ご利用について（案）</h3>
    <ul>
      <li>トレース・模写・加工してOKです</li>
      <li>商用利用もOKです</li>
      <li>クレジット表記は不要です（書いてくれたら嬉しいです）</li>
      <li>写真そのものの再配布・転載はご遠慮ください</li>
    </ul>
    <p>「こんな服・ポーズ・持ち物が欲しい」は、TikTokのコメント欄か「リクエストする」からどうぞ。</p>
  </div>
</footer>

<dialog id="lb" aria-label="写真の拡大表示">
  <div class="lb">
    <div class="lb-stage">
      <button class="lb-close" id="lbClose" aria-label="閉じる">×</button>
      <button class="lb-nav prev" id="lbPrev" aria-label="前の写真">‹</button>
      <img id="lbImg" alt="">
      <button class="lb-nav next" id="lbNext" aria-label="次の写真">›</button>
    </div>
    <div class="lb-bar">
      <div class="lb-cap" id="lbCap"></div>
      <a class="btn" id="lbDl" href="#" download>ダウンロード</a>
    </div>
  </div>
</dialog>

<!-- アクセス解析（公開時に有効化）: Cloudflare Web Analytics のスニペットをここに貼る -->
<script src="photos.js?v=20261015d"></script>
<script>
(function(){
  const CATS = ['全身ポーズ','上半身・ジェスチャー','手','スーツ'];
  const WEAR_PREF = ['学ラン','スーツ','ウェイター','Tシャツ'];
  const ANGLE_PREF = ['正面','斜め','横','後ろ'];
  // 写真データに存在する値を自動で拾う（希望の並び順を優先し、新しい値は末尾に追加）
  const uniq = (key, pref) => {
    const have = [...new Set(PHOTOS.map(p => p[key]))];
    return [...pref.filter(v => have.includes(v)), ...have.filter(v => !pref.includes(v))];
  };
  const WEARS = uniq('wear', WEAR_PREF);
  const ANGLES = uniq('angle', ANGLE_PREF);
  const ALL = 'すべて';
  const state = { cat: ALL, wear: new Set(), angle: new Set() };
  const gkey = p => `${p.cat}|${p.wear}|${p.series}`;
  const firstId = {};
  PHOTOS.forEach(p => { firstId[gkey(p)] = Math.min(firstId[gkey(p)] ?? Infinity, p.id); });
  // カテゴリ順 → シリーズ（最初に撮った順）→ シリーズ内の連番（正面→斜め[右から→左から]→横→後ろ。右左は並べる時だけ使い、表示は「斜め」のみ）
  const data = [...PHOTOS].sort((a,b) => CATS.indexOf(a.cat) - CATS.indexOf(b.cat) || firstId[gkey(a)] - firstId[gkey(b)] || a.step - b.step);
  let visible = [];

  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function matches(p, skip){
    return (skip === 'cat'   || state.cat === ALL || p.cat === state.cat)
        && (skip === 'wear'  || !state.wear.size  || state.wear.has(p.wear))
        && (skip === 'angle' || !state.angle.size || state.angle.has(p.angle));
  }

  function renderTabs(){
    const total = data.filter(p => matches(p, 'cat')).length;
    const items = [[ALL, total], ...CATS.map(c => [c, data.filter(p => p.cat === c && matches(p, 'cat')).length])];
    $('#tabs').innerHTML = items.map(([c, n]) =>
      `<button class="tab" role="tab" data-cat="${esc(c)}" aria-selected="${state.cat === c}">${esc(c)}<span class="n">${n}</span></button>`
    ).join('');
  }

  function renderChips(el, list, key, group){
    $(el).innerHTML = list.map(v => {
      const n = data.filter(p => p[key] === v && matches(p, group)).length;
      const on = state[group].has(v);
      return `<button class="chip" data-group="${group}" data-v="${esc(v)}" aria-pressed="${on}" ${(!n && !on) ? 'disabled' : ''}>${esc(v)}<span class="n">${n}</span></button>`;
    }).join('');
  }

  function renderGallery(){
    visible = data.filter(p => matches(p));
    if (!visible.length){
      const prep = state.cat !== ALL && !data.some(p => p.cat === state.cat);
      $('#gallery').innerHTML = prep
        ? '<p class="empty">このカテゴリの写真は準備中です。もう少しお待ちください。</p>'
        : '<p class="empty">該当する写真がありません。絞り込みを解除してみてください。</p>';
      return;
    }
    let html = '', last = null, open = false;
    visible.forEach((p, i) => {
      const key = `${p.cat}|${p.wear}|${p.series}`;
      if (key !== last){
        if (open) html += '</div></section>';
        const n = visible.filter(q => q.cat === p.cat && q.wear === p.wear && q.series === p.series).length;
        html += `<section class="group"><div class="ghead"><h2>${esc(p.wear)}｜${esc(p.series)}</h2><span>${state.cat === ALL ? esc(p.cat) + '・' : ''}${n}枚</span></div><div class="grid">`;
        last = key; open = true;
      }
      html += `<button class="card" data-i="${i}" aria-label="${esc(`${p.wear} ${p.series} ${p.step}枚目 ${p.angle}`)}を拡大"><img src="${esc(p.thumb)}" alt="" loading="lazy"><span class="step">${String(p.step).padStart(2,'0')}</span><span class="ang">${esc(p.angle)}</span></button>`;
    });
    if (open) html += '</div></section>';
    $('#gallery').innerHTML = html;
  }

  function render(){
    renderTabs();
    renderChips('#wearChips', WEARS, 'wear', 'wear');
    renderChips('#angleChips', ANGLES, 'angle', 'angle');
    renderGallery();
    $('#count').textContent = `${visible.length}枚を表示（全${data.length}枚）`;
    $('#reset').hidden = !(state.cat !== ALL || state.wear.size || state.angle.size);
  }

  function setHash(){
    try { history.replaceState(null, '', state.cat === ALL ? location.pathname + location.search : '#' + encodeURIComponent(state.cat)); } catch(e){}
  }

  // events
  $('#tabs').addEventListener('click', e => {
    const b = e.target.closest('.tab'); if (!b) return;
    state.cat = b.dataset.cat; setHash(); render();
    window.scrollTo({ top: 0 });
  });
  document.querySelector('.filters').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b || b.disabled) return;
    const s = state[b.dataset.group];
    s.has(b.dataset.v) ? s.delete(b.dataset.v) : s.add(b.dataset.v);
    render();
  });
  $('#reset').addEventListener('click', () => { state.cat = ALL; state.wear.clear(); state.angle.clear(); setHash(); render(); });
  $('#gallery').addEventListener('click', e => {
    const b = e.target.closest('.card'); if (b) openLb(+b.dataset.i);
  });

  // lightbox
  const lb = $('#lb'), lbImg = $('#lbImg');
  let cur = 0;
  function show(i){
    const n = visible.length; if (!n) return;
    cur = (i + n) % n;
    const p = visible[cur];
    lbImg.src = p.full;
    lbImg.alt = `${p.wear} ${p.series} ${p.step}枚目 ${p.angle}`;
    $('#lbCap').innerHTML = `<strong>${esc(p.wear)}｜${esc(p.series)} ${String(p.step).padStart(2,'0')}</strong><small>${esc(p.cat)}・${esc(p.angle)}・${cur + 1}/${n}</small>`;
    const dl = $('#lbDl'); dl.href = p.full; dl.setAttribute('download', p.name);
    [1, -1].forEach(d => { new Image().src = visible[(cur + d + n) % n].full; });
  }
  function openLb(i){ show(i); if (!lb.open) lb.showModal(); }
  $('#lbClose').addEventListener('click', () => lb.close());
  $('#lbPrev').addEventListener('click', () => show(cur - 1));
  $('#lbNext').addEventListener('click', () => show(cur + 1));
  lb.addEventListener('click', e => { if (e.target === lb || e.target.classList.contains('lb') || e.target.classList.contains('lb-stage')) lb.close(); });
  document.addEventListener('keydown', e => {
    if (!lb.open) return;
    if (e.key === 'ArrowLeft') show(cur - 1);
    if (e.key === 'ArrowRight') show(cur + 1);
  });
  let sx = null;
  lb.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener('touchend', e => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx; sx = null;
    if (Math.abs(dx) > 50) show(cur + (dx < 0 ? 1 : -1));
  });

  // init
  const h = decodeURIComponent(location.hash.slice(1));
  if (CATS.includes(h)) state.cat = h;
  render();
})();
</script>
</body>
</html>
